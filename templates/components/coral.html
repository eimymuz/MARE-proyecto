<!-- ══════════════════════════════════════════════════════
     CORAL — Asistente IA de MARE
     Agregar justo antes del </body> en base.html
     ══════════════════════════════════════════════════════ -->

<!-- Burbuja flotante -->
<div id="coral-fab" onclick="toggleCoral()"
  style="position:fixed;bottom:1.5rem;right:1.5rem;z-index:900;
         width:54px;height:54px;border-radius:50%;
         background:var(--navy);border:2px solid var(--accent);
         display:flex;align-items:center;justify-content:center;
         cursor:pointer;box-shadow:0 4px 20px rgba(10,37,64,.35);
         transition:all .2s">
        <!-- Icono coral  -->
        <img src="/static/img/icon.png" width="30" height="30" style="object-fit:contain">
</div>

<!-- Ventana de chat -->
<div id="coral-chat" style="display:none;position:fixed;bottom:5rem;right:1.5rem;
     z-index:901;width:340px;max-height:520px;
     background:var(--surface);border-radius:var(--radius-lg);
     box-shadow:0 8px 40px rgba(10,37,64,.2);
     border:1px solid var(--border);
     display:flex;flex-direction:column;overflow:hidden;
     animation:coral-open .2s ease">

  <!-- Header -->
  <div style="background:var(--navy);padding:.85rem 1rem;
       display:flex;align-items:center;justify-content:space-between">
    <div style="display:flex;align-items:center;gap:8px">
      <div style="width:32px;height:32px;border-radius:50%;
           background:rgba(201,168,76,.15);border:1px solid var(--accent);
           display:flex;align-items:center;justify-content:center">
           <!-- Icono coral  -->
            <img src="/static/img/icon.png" width="18" height="18" style="object-fit:contain">
      </div>
      <div>
        <div style="font-size:13px;font-weight:600;color:#fff">Coral</div>
        <div style="font-size:10px;color:rgba(255,255,255,.5);margin-top:1px">
          Asistente MARE
        </div>
      </div>
    </div>
    <button onclick="toggleCoral()"
      style="background:none;border:none;color:rgba(255,255,255,.5);
             cursor:pointer;font-size:18px;line-height:1;padding:2px">✕</button>
  </div>

  <!-- Mensajes -->
  <div id="coral-mensajes"
    style="flex:1;overflow-y:auto;padding:.85rem;
           display:flex;flex-direction:column;gap:.6rem;
           max-height:340px;min-height:200px">
    <!-- Mensaje bienvenida -->
    <div class="coral-msg coral-msg-bot">
      ¡Hola! Soy <strong>Coral</strong>, tu asistente de marina. 🐚<br>
      Puedo ayudarte con consultas operativas. Prueba preguntarme algo:
    </div>
    <!-- Sugerencias rápidas -->
    <div id="coral-sugerencias" style="display:flex;flex-direction:column;gap:.3rem">
      <button class="coral-sug" onclick="preguntarCoral('¿Quiénes salen hoy?')">
        🚢 ¿Quiénes salen hoy?
      </button>
      <button class="coral-sug" onclick="preguntarCoral('¿Quiénes llegan hoy?')">
        ⚓ ¿Quiénes llegan hoy?
      </button>
      <button class="coral-sug" onclick="preguntarCoral('¿Cuántas solicitudes pendientes hay?')">
        📋 ¿Cuántas solicitudes pendientes?
      </button>
      <button class="coral-sug" onclick="preguntarCoral('¿Cómo está la ocupación de la marina?')">
        🗺️ ¿Cómo está la ocupación?
      </button>
      <button class="coral-sug" onclick="preguntarCoral('¿Cuántos veleros hay este mes?')">
        ⛵ ¿Cuántos veleros hay este mes?
      </button>
    </div>
  </div>

  <!-- Input -->
  <div style="padding:.7rem;border-top:1px solid var(--border);
       display:flex;gap:.4rem;background:var(--bg)">
    <input id="coral-input" type="text"
      placeholder="Escribe tu pregunta..."
      onkeydown="if(event.key==='Enter') enviarCoral()"
      style="flex:1;font-size:13px;padding:.45rem .65rem;
             border:1px solid var(--border);border-radius:var(--radius);
             background:var(--surface);color:var(--text);outline:none">
    <button onclick="enviarCoral()"
      style="background:var(--navy);color:var(--accent);border:none;
             border-radius:var(--radius);padding:.45rem .7rem;
             cursor:pointer;font-size:14px;transition:background .15s">
      ➤
    </button>
  </div>
</div>

<style>
@keyframes coral-open {
  from { opacity:0; transform:translateY(10px) scale(.97); }
  to   { opacity:1; transform:translateY(0)    scale(1); }
}
.coral-msg {
  font-size:13px;line-height:1.5;padding:.6rem .75rem;
  border-radius:10px;max-width:90%;word-break:break-word;
}
.coral-msg-bot {
  background:var(--bg);color:var(--text);
  border-bottom-left-radius:3px;align-self:flex-start;
}
.coral-msg-user {
  background: var(--navy);
  color: #9e9c9c !important;
  border-bottom-right-radius: 3px;
  align-self: flex-end;
}
.coral-msg-error {
  background:var(--danger-bg);color:var(--danger);
  border-bottom-left-radius:3px;align-self:flex-start;
}
.coral-sug {
  background:var(--surface);border:1px solid var(--border);
  border-radius:20px;padding:.35rem .75rem;font-size:12px;
  color:var(--text);cursor:pointer;text-align:left;
  transition:all .15s;font-family:inherit;
}
.coral-sug:hover {
  background:var(--navy);color:#fff;border-color:var(--navy);
}
.coral-typing {
  display:flex;gap:4px;align-items:center;padding:.5rem .75rem;
}
.coral-typing span {
  width:6px;height:6px;border-radius:50%;
  background:var(--text-light);display:inline-block;
  animation:coral-dot .9s infinite;
}
.coral-typing span:nth-child(2){animation-delay:.15s}
.coral-typing span:nth-child(3){animation-delay:.3s}
@keyframes coral-dot {
  0%,80%,100%{transform:scale(.6);opacity:.4}
  40%{transform:scale(1);opacity:1}
}
</style>

<script>
const CORAL_CSRF = "{{ csrf_token }}";
let _coralAbierto = false;

function toggleCoral(){
  _coralAbierto = !_coralAbierto;
  const chat = document.getElementById('coral-chat');
  const fab  = document.getElementById('coral-fab');
  chat.style.display = _coralAbierto ? 'flex' : 'none';
  fab.style.background = _coralAbierto ? 'var(--accent)' : 'var(--navy)';
  fab.querySelector('svg').style.stroke = _coralAbierto ? 'var(--navy)' : 'var(--accent)';
  if(_coralAbierto){
    document.getElementById('coral-input').focus();
  }
}

function preguntarCoral(texto){
  // ocultar sugerencias al usar una
  const sugs = document.getElementById('coral-sugerencias');
  if(sugs) sugs.style.display = 'none';
  document.getElementById('coral-input').value = texto;
  enviarCoral();
}

async function enviarCoral(){
  const input = document.getElementById('coral-input');
  const msg   = input.value.trim();
  if(!msg) return;

  input.value = '';
  agregarMensaje(msg, 'user');
  mostrarTyping();

  try{
    const res  = await fetch('/asistente/', {
      method:  'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-CSRFToken':  CORAL_CSRF,
      },
      body: JSON.stringify({ mensaje: msg }),
    });
    const data = await res.json();
    quitarTyping();
    agregarMensaje(data.respuesta || 'No pude procesar esa pregunta.', 'bot');
  } catch(err){
    quitarTyping();
    agregarMensaje('Error de conexión. Intenta de nuevo.', 'error');
  }
}

function agregarMensaje(texto, tipo){
  const cont = document.getElementById('coral-mensajes');
  const div  = document.createElement('div');
  div.className = `coral-msg coral-msg-${tipo}`;
  div.innerHTML = texto;
  cont.appendChild(div);
  cont.scrollTop = cont.scrollHeight;
}

function mostrarTyping(){
  const cont = document.getElementById('coral-mensajes');
  const div  = document.createElement('div');
  div.id = 'coral-typing-indicator';
  div.className = 'coral-msg coral-msg-bot coral-typing';
  div.innerHTML = '<span></span><span></span><span></span>';
  cont.appendChild(div);
  cont.scrollTop = cont.scrollHeight;
}

function quitarTyping(){
  const el = document.getElementById('coral-typing-indicator');
  if(el) el.remove();
}
</script>
